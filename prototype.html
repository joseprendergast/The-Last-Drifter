function renderEvidence(){E.mini.innerHTML="";if(!save.evidence.length){let c=document.createElement("span");c.className="chip";c.textContent="No evidence";E.mini.appendChild(c)}else save.evidence.slice(-5).forEach(k=>{let c=document.createElement("span");c.className="chip new";c.textContent=catalog[k][0];E.mini.appendChild(c)});E.grid.innerHTML="";if(!save.evidence.length){E.grid.innerHTML='<article class="note"><h3>No evidence yet</h3><p>Start the game and investigate the scene. Every clue you collect will land here.</p></article>';return}save.evidence.forEach(k=>{let e=catalog[k],n=document.createElement("article");n.className="note";n.innerHTML=`<h3>${e[0]}</h3><p>${e[1]}</p><p>${e[2]}</p><button class="item">Use as active clue</button>`;n.querySelector("button").onclick=()=>{toast("Active clue: "+e[0]);closeAll()};E.grid.appendChild(n)})}

function resetFx(){Object.assign(fx,{hand:false,trail:false,door:false,light:true,alarm:false,bodies:false,quiet:false,panic:false,blood:false,dark:0})}function loadScene(id,opt={}){let s=scenes.find(q=>q.id===id);if(!s)return;closeAll();scene=s;save.current=s.id;beat=opt.skip?s.intro.length:0;chars=0;beatDone=false;resetFx();srand(s.seed);initRain(s.rain||80);start=performance.now();E.chap.textContent="CHAPTER "+s.chap;E.small.textContent=s.title;E.title.classList.remove("on");E.fade.classList.remove("clear");setTimeout(()=>{E.fade.classList.add("clear");opt.skip?investigate():enterBeat()},350);persist()}function newGame(){let settings=save.settings;save=clone(blank);save.settings=settings;persist();loadScene("alley")}function cont(){loadScene(save.current||"alley",{skip:!!save.current})}function reset(){let settings=save.settings;save=clone(blank);save.settings=settings;persist();scene=null;mode="title";hideHots();E.who.textContent="";E.line.textContent="";E.chap.textContent="CHAPTER -";E.small.textContent="THE LAST DRIFTER";E.title.classList.add("on");closeAll();toast("Progress reset.")}
