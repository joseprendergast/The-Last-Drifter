const scenes=[{id:'alley',chap:'I',title:'The Alley',desc:'Night. Heavy rain. Captain Gabardina wakes on wet pavement with a hand that is not his own.',seed:101,rain:140,obj(){return !flag('saw_hand')?'Find out what is lying on Gabardina\'s chest.':!flag('checked_drain')?'Follow the blood trail before the rain hides it.':!flag('alley_done')?'Leave the alley through the service door.':'The alley memory is complete.'},intro:[['','Three minutes past the hour. Heavy rain over the docks.'],['','Captain Gabardina wakes on wet pavement, breathing like a man dragged up from black water.',()=>jolt(1.4)],['','Something is resting on his chest. Something pale.',()=>{fx.hand=true;zap(.5)}],['','A hand. Not his own.',()=>setFlag('saw_hand')],['','The rain keeps tapping the fingers, like it expects an answer.',null,true]],hot:[['hand','Inspect hand',45,58,15,13,()=>fx.hand||flag('saw_hand'),()=>{addEv('hand');setFlag('saw_hand');say('GABARDINA','Wax cold. No pulse. For one frame in the lightning, it knew me.');zap(.8)}],['coat','Search coat',35,63,16,22,null,()=>{addEv('thread');say('GABARDINA','Threads under the stair. Same gabardine weave as mine. Older. Bloodier.')}],['drain','Check drain',68,72,14,12,null,()=>{addEv('drain');setFlag('checked_drain');fx.trail=true;say('','The grate drinks rain and refuses blood. The trail bends toward a service door.')}],['door','Open service door',83,32,12,38,null,()=>{if(!flag('checked_drain'))return say('GABARDINA','Not yet. The alley is still hiding the direction of the wound.');setFlag('alley_done');complete('alley');toast('Scene complete: The Alley');loadScene('lab')}]],paint:paintAlley},{id:'lab',chap:'II',title:'The Blood Lab',desc:'Sub-level four. An accountant opens the sealed lavatory and finds the work still remembering.',seed:202,rain:0,obj(){return !flag('found_lab')?'Get the accountant through the security door.':!flag('power')?'Restore enough power to read the monitors.':!flag('reel')?'Recover the memory reel from the blood lab.':'The blood lab memory is complete.'},intro:[['','Sub-level four. The accountant arrives twenty minutes late.'],['','She fumbles her key card. The reader stutters. Lets her through.',()=>{fx.door=true;addEv('card')}],['','The smell hits her before the sight does. Copper. Solvent. The thin sweet rot of something interrupted.',()=>setFlag('found_lab')],['','She does not scream. She has never been the kind of person who screams.',null,true]],hot:[['reader','Swipe keycard',11,38,10,20,null,()=>{addEv('card');fx.door=true;setFlag('found_lab');say('','The reader blinks green after showing the same timestamp eleven times.')}],['breaker','Restore power',78,22,13,25,null,()=>{fx.light=true;fx.alarm=true;setFlag('power');addEv('alarm');jolt(2);say('','The fluorescent light returns in pieces. The alarm starts counting backward.')}],['monitor','Read monitor',38,28,24,18,null,()=>{if(!flag('power'))return say('','The screen is dead, except for one red line crawling under the glass.');addEv('alarm');say('','The monitor is drawing pictures of someone\'s memory in red.')}],['reel','Take memory reel',54,62,18,12,null,()=>{if(!flag('power'))return say('','The table is too dark, too wet, too full of shapes.');setFlag('reel');addEv('reel');fx.bodies=true;say('ACCOUNTANT','This is not an invoice. This is an animal remembering how to be a person.')}],['exit','Follow alarm',87,55,10,28,null,()=>{if(!flag('reel'))return say('','The alarm points nowhere until the reel comes with you.');complete('lab');toast('Scene complete: The Blood Lab');loadScene('zoo')}]],paint:paintLab},{id:'zoo',chap:'III',title:'The Zoo',desc:'Morning. Families, balloons, coffee steam. Then every animal begins screaming at once.',seed:303,rain:0,obj(){return !flag('ticket')?'Enter the morning crowd and inspect the ticket booth.':!flag('saw_sign')?'Watch the zoo sign when the animals scream.':!flag('heard_child')?'Listen to the child who does not run.':'The first playable slice is complete.'},intro:[['','For the fir function clone(o){return JSON.parse(JSON.stringify(o))}function load(){try{return Object.assign(clone(blank),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return clone(blank)}}function persist(){localStorage.setItem(KEY,JSON.stringify(save));renderEvidence();renderObj();$('cont').disabled=!(save.current||save.evidence.length||save.done.length)}function flag(k){return !!save.flags[k]}function setFlag(k){if(!save.flags[k]){save.flags[k]=true;persist()}}function addEv(k){if(save.evidence.includes(k))return;save.evidence.push(k);toast('Evidence added: '+cat[k][0]);cue('evidence');persist()}function complete(k){if(!save.done.includes(k))save.done.push(k);persist()}function srand(v){seed=v||1}function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}function rect(a,b,c,d,e){x.fillStyle=e;x.fillRect(a|0,b|0,c|0,d|0)}function ln(a,b,c,d,e){x.strokeStyle=e;x.beginPath();x.moveTo(a|0,b|0);x.lineTo(c|0,d|0);x.stroke()}function txt(s,a,b,c){x.fillStyle=c;x.font='8px monospace';x.fillText(s,a,b)}function initRain(n){rain.length=0;for(let i=0;i<n;i++)rain.push({x:rnd()*W,y:rnd()*H,v:2+rnd()*3,l:4+rnd()*8,a:.25+rnd()*.55})}function drawRain(m=1){if(save.settings.motion)m*=.35;x.save();for(const d of rain){d.y+=d.v*m;d.x-=d.v*.42*m;if(d.y>H+8){d.y=-8;d.x=rnd()*W}if(d.x<-8)d.x=W+8;x.globalAlpha=d.a*m;x.fillStyle='#a2a6b4';for(let i=0;i<d.l;i++)x.fillRect((d.x-i*.5)|0,(d.y+i)|0,1,1)}x.restore();x.globalAlpha=1}function zap(v){flash=Math.max(flash,save.settings.motion?v*.25:v);cue('sting')}function jolt(v){if(!save.settings.motion)shake=Math.max(shake,v)}function cam(){let a=(rnd()*2-1)*shake,b=(rnd()*2-1)*shake;shake*=.88;x.translate(a,b)}function drawFlash(){if(flash<=0)return;x.globalAlpha=flash*.62;rect(0,0,W,H,'#e8dfc8');x.globalAlpha=1;flash*=save.settings.motion?.52:.78}function man(a,b,c='#6b5138'){rect(a+3,b,8,3,'#19120e');rect(a+4,b+3,6,5,'#c6a77c');rect(a+2,b+8,10,15,c);rect(a+4,
